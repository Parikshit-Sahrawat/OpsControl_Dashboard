user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Do not log query strings, authorization headers, enrollment bodies or tokens.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    limit_req_zone $binary_remote_addr zone=agent_requests:10m rate=30r/s;
    server {
        listen 8443 ssl;
        ssl_certificate /etc/opscontrol/tls/tls.crt;
        ssl_certificate_key /etc/opscontrol/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        location = /health {
            proxy_pass http://api:8000/health;
            proxy_set_header Host api;
        }
        location /api/v1/agent/ {
            limit_req zone=agent_requests burst=60 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
        # Resource/access administration never traverses the ingestion listener.
        location / { return 404; }
    }
}
