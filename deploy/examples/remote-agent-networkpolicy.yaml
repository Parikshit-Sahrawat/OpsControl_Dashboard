# EXAMPLE ONLY. Not applied by the project. Adjust pod/namespace labels,
# control-plane IP and app subnet, then review with your CNI/network team.
# NetworkPolicy requires an enforcing CNI; it is not effective on every cluster.
# 203.0.113.10 is a reserved documentation address, NOT a working endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remote-agent-egress-only
  namespace: opscontrol-agents
spec:
  podSelector:
    matchLabels:
      app: opscontrol-remote-agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # no incoming connections to agent
  egress:
    # Only designated DNS pods; customize DNS labels for your distribution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Trusted OpsControl management API endpoint: replace test IP.
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: TCP
          port: 443
    # Approved private application subnet: replace with narrow production CIDRs.
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 443
