# opscontrol-filelog-durable-handoff-v1: stanza.synchronousLogEmitter
receivers:
  filelog/56d1cfdaac094a2b990c048febb6922c_7f252a43adc14bcd:
    include:
    - /fixture/input/*.log
    include_file_path: true
    include_file_name: true
    exclude:
    - ${env:OPSCONTROL_AGENT_STATE_DIR}/**
    start_at: beginning
    storage: file_storage/opscontrol
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    operators:
    - type: json_parser
    - type: add
      field: attributes["opscontrol.method.id"]
      value: 56d1cfda-ac09-4a2b-990c-048febb6922c
    - type: add
      field: attributes["opscontrol.log.source.id"]
      value: 56d1cfda-ac09-4a2b-990c-048febb6922c:7f252a43adc14bcd
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/opscontrol:
    attributes:
    - key: opscontrol.collector.id
      value: d4ce1022-de2a-497c-968b-3bde16a420f8
      action: upsert
    - key: opscontrol.organization.id
      value: a2d93170-8162-418f-8bb0-c873bc32f884
      action: upsert
    - key: deployment.environment
      value: SANDBOX
      action: upsert
exporters:
  otlphttp/opscontrol:
    endpoint: https://172.18.0.1:35547/api/v1/agent/otlp
    headers:
      Authorization: Bearer ${env:OPSCONTROL_AGENT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 256
      storage: file_storage/opscontrol
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/opscontrol:
    directory: ${env:OPSCONTROL_AGENT_STATE_DIR}/otel-checkpoints
    create_directory: true
    fsync: true
service:
  extensions:
  - health_check
  - file_storage/opscontrol
  pipelines:
    logs:
      receivers:
      - filelog/56d1cfdaac094a2b990c048febb6922c_7f252a43adc14bcd
      processors:
      - memory_limiter
      - resource/opscontrol
      exporters:
      - otlphttp/opscontrol
