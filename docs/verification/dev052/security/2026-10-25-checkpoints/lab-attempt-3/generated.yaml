receivers:
  filelog/b28f40542b8e4adba01d35772105cd34_2140d08644768f3a:
    include:
    - /fixture/logs/*.log
    include_file_path: true
    include_file_name: true
    exclude:
    - ${env:OPSCONTROL_AGENT_STATE_DIR}/**
    start_at: beginning
    storage: file_storage/opscontrol
    operators:
    - type: json_parser
    - type: add
      field: attributes["opscontrol.method.id"]
      value: b28f4054-2b8e-4adb-a01d-35772105cd34
    - type: add
      field: attributes["opscontrol.log.source.id"]
      value: b28f4054-2b8e-4adb-a01d-35772105cd34:2140d08644768f3a
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/opscontrol:
    attributes:
    - key: opscontrol.collector.id
      value: 2a3109cb-224e-4be1-a63b-1378b56d40e2
      action: upsert
    - key: opscontrol.organization.id
      value: c4f90e03-071b-4135-9caf-8c83902eee42
      action: upsert
    - key: deployment.environment
      value: SANDBOX
      action: upsert
exporters:
  otlphttp/opscontrol:
    endpoint: https://172.18.0.1:35605/api/v1/agent/otlp
    headers:
      Authorization: Bearer ${env:OPSCONTROL_AGENT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 256
      storage: file_storage/opscontrol
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/opscontrol:
    directory: ${env:OPSCONTROL_AGENT_STATE_DIR}/otel-checkpoints
    create_directory: true
service:
  extensions:
  - health_check
  - file_storage/opscontrol
  pipelines:
    logs:
      receivers:
      - filelog/b28f40542b8e4adba01d35772105cd34_2140d08644768f3a
      processors:
      - memory_limiter
      - resource/opscontrol
      - batch
      exporters:
      - otlphttp/opscontrol
