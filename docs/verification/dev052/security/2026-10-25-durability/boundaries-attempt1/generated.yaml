# opscontrol-filelog-durable-handoff-v1: stanza.synchronousLogEmitter
receivers:
  filelog/5e8cca781f794b5fac4e8a76f27e0089_700bddceffd69782:
    include:
    - /fixture/current.log
    include_file_path: true
    include_file_name: true
    exclude:
    - ${env:OPSCONTROL_AGENT_STATE_DIR}/**
    start_at: beginning
    storage: file_storage/opscontrol
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    operators:
    - type: json_parser
    - type: add
      field: attributes["opscontrol.method.id"]
      value: 5e8cca78-1f79-4b5f-ac4e-8a76f27e0089
    - type: add
      field: attributes["opscontrol.log.source.id"]
      value: 5e8cca78-1f79-4b5f-ac4e-8a76f27e0089:700bddceffd69782
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/opscontrol:
    attributes:
    - key: opscontrol.collector.id
      value: 7455a12c-6ae8-44a3-88fc-0199d6dcb8b7
      action: upsert
    - key: opscontrol.organization.id
      value: 45baa90f-f3f4-4255-b7e2-4da63639d379
      action: upsert
    - key: deployment.environment
      value: SANDBOX
      action: upsert
exporters:
  otlphttp/opscontrol:
    endpoint: https://172.18.0.1:33145/api/v1/agent/otlp
    headers:
      Authorization: Bearer ${env:OPSCONTROL_AGENT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 256
      storage: file_storage/opscontrol
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/opscontrol:
    directory: ${env:OPSCONTROL_AGENT_STATE_DIR}/otel-checkpoints
    create_directory: true
    fsync: true
service:
  extensions:
  - health_check
  - file_storage/opscontrol
  pipelines:
    logs:
      receivers:
      - filelog/5e8cca781f794b5fac4e8a76f27e0089_700bddceffd69782
      processors:
      - memory_limiter
      - resource/opscontrol
      exporters:
      - otlphttp/opscontrol
