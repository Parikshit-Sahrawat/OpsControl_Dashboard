receivers:
  filelog/d61f8dc27b674225abaf3214ac1fe243_2140d08644768f3a:
    include:
    - /fixture/logs/*.log
    include_file_path: true
    include_file_name: true
    exclude:
    - ${env:OPSCONTROL_AGENT_STATE_DIR}/**
    start_at: beginning
    storage: file_storage/opscontrol
    operators:
    - type: json_parser
    - type: add
      field: attributes["opscontrol.method.id"]
      value: d61f8dc2-7b67-4225-abaf-3214ac1fe243
    - type: add
      field: attributes["opscontrol.log.source.id"]
      value: d61f8dc2-7b67-4225-abaf-3214ac1fe243:2140d08644768f3a
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/opscontrol:
    attributes:
    - key: opscontrol.collector.id
      value: 34647288-645b-48d5-8334-ebb6f1d05623
      action: upsert
    - key: opscontrol.organization.id
      value: 38f2315f-d25b-41db-8e40-cc27919fb0e5
      action: upsert
    - key: deployment.environment
      value: SANDBOX
      action: upsert
exporters:
  otlphttp/opscontrol:
    endpoint: https://172.18.0.1:33361/api/v1/agent/otlp
    headers:
      Authorization: Bearer ${env:OPSCONTROL_AGENT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 256
      storage: file_storage/opscontrol
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/opscontrol:
    directory: ${env:OPSCONTROL_AGENT_STATE_DIR}/otel-checkpoints
    create_directory: true
service:
  extensions:
  - health_check
  - file_storage/opscontrol
  pipelines:
    logs:
      receivers:
      - filelog/d61f8dc27b674225abaf3214ac1fe243_2140d08644768f3a
      processors:
      - memory_limiter
      - resource/opscontrol
      - batch
      exporters:
      - otlphttp/opscontrol
