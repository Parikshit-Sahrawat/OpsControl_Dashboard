# opscontrol-filelog-durable-handoff-v1: stanza.synchronousLogEmitter
receivers:
  filelog/bcef537ece1148e38e967e4bfa383b09_700bddceffd69782:
    include:
    - /fixture/current.log
    include_file_path: true
    include_file_name: true
    exclude:
    - ${env:OPSCONTROL_AGENT_STATE_DIR}/**
    start_at: beginning
    storage: file_storage/opscontrol
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    operators:
    - type: json_parser
    - type: add
      field: attributes["opscontrol.method.id"]
      value: bcef537e-ce11-48e3-8e96-7e4bfa383b09
    - type: add
      field: attributes["opscontrol.log.source.id"]
      value: bcef537e-ce11-48e3-8e96-7e4bfa383b09:700bddceffd69782
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
  resource/opscontrol:
    attributes:
    - key: opscontrol.collector.id
      value: 4784a0c5-5b9c-475a-a48f-adee7d79cea6
      action: upsert
    - key: opscontrol.organization.id
      value: 4d974816-f85a-4da7-9aaa-816997bb7c8a
      action: upsert
    - key: deployment.environment
      value: SANDBOX
      action: upsert
exporters:
  otlphttp/opscontrol:
    endpoint: https://172.18.0.1:50631/api/v1/agent/otlp
    headers:
      Authorization: Bearer ${env:OPSCONTROL_AGENT_TOKEN}
    tls:
      insecure: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 256
      storage: file_storage/opscontrol
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/opscontrol:
    directory: ${env:OPSCONTROL_AGENT_STATE_DIR}/otel-checkpoints
    create_directory: true
    fsync: true
service:
  extensions:
  - health_check
  - file_storage/opscontrol
  pipelines:
    logs:
      receivers:
      - filelog/bcef537ece1148e38e967e4bfa383b09_700bddceffd69782
      processors:
      - memory_limiter
      - resource/opscontrol
      exporters:
      - otlphttp/opscontrol
