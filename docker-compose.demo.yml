# Localhost-only, synthetic data — do not deploy as-is publicly.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17
    environment:
      POSTGRES_DB: opscontrol
      POSTGRES_USER: opscontrol
      POSTGRES_PASSWORD: demo-db-local-only
    volumes:
      - opscontrol_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U opscontrol -d opscontrol"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [demo_backend]
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.demo
    environment:
      ENVIRONMENT: demo
      SEED_DEMO_DATA: "false"
      DATABASE_URL: postgresql+psycopg://opscontrol:demo-db-local-only@postgres:5432/opscontrol
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      OPSCONTROL_DEMO_PASSWORD_FILE: /run/secrets/demo_admin_password
    volumes:
      - ./.demo-private/admin-password:/run/secrets/demo_admin_password:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [demo_backend]
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    depends_on: [api]
    networks: [demo_backend]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  opscontrol_demo_pgdata:
networks:
  demo_backend:
    driver: bridge
