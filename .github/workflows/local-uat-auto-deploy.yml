name: "OC Dev - Tier F - Approved UAT Release Publication - Manual Gated"
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved immutable main SHA
        required: true
        type: string
      approval_ref:
        description: Committed release authorization record ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: opscontrol-uat-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.OC_RELEASE_PHASE == 'SPRINT10_APPROVED' && vars.OC_UAT_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: release-uat-authorization
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact current main and approved PR
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.source_sha }}
          APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          test "$current" = "$GITHUB_SHA"
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          python3 scripts/ci/release_authorization.py --sha "$APPROVED_SHA" --record "$APPROVAL_REF" --operation publish
          python3 scripts/uat/verify_publish.py "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Normalize image prefix
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.uat
          push: true
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
          provenance: true
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.demo
          push: true
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.LOCAL_UAT_PUBLIC_API_URL }}
          provenance: true
      - name: Create release manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
        run: python3 scripts/uat/create_release.py
      - name: Attest exact manifest bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release.json
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          gh release create "uat-$GITHUB_SHA" release.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "UAT release $GITHUB_SHA" --notes 'Signed UAT release manifest; deployment controlled by local policy.'
