name: Publish verified UAT release (hosted only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: opscontrol-uat-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact current main and approved PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          test "$current" = "$GITHUB_SHA"
          python3 scripts/uat/verify_publish.py "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Normalize image prefix
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.uat
          push: true
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
          provenance: true
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.demo
          push: true
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.LOCAL_UAT_PUBLIC_API_URL }}
          provenance: true
      - name: Create release manifest
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          IMAGE_PREFIX: ${{ steps.names.outputs.prefix }}
        run: python3 scripts/uat/create_release.py
      - name: Attest exact manifest bytes
        uses: actions/attest@v4
        with:
          subject-path: release.json
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          gh release create "uat-$GITHUB_SHA" release.json --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "UAT release $GITHUB_SHA" --notes 'Signed UAT release manifest; deployment controlled by local policy.'
