name: Controlled release reliability and deployment
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-retention-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install existing locked frontend and backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && backend/.venv/bin/pip install -r backend/requirements-providers.txt -r backend/requirements-hosts.txt
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/release-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Offline security regression
        run: (cd backend && .venv/bin/python -m unittest discover -s tests -v)
      - name: Non-root runtime image under a restrictive checkout umask
        run: |
          chmod -R go-rwx backend/app backend/scripts
          docker build --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt -f backend/Dockerfile.runtime -t opscontrol-runtime:acceptance backend
          docker run --rm --network none --read-only --entrypoint python opscontrol-runtime:acceptance -c 'import os; from app.core.config import settings; import scripts.run_api; assert os.geteuid()==10001; print("Non-root read-only runtime imports PASS")'
      - name: Populated restore, bounded retention, multi-process recovery and actual TLS ingress
        env:
          RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/release-evidence
          RELEASE_BROWSER_ACCEPTANCE: '1'
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/release-tools/node_modules/playwright/index.mjs
        run: backend/.venv/bin/python scripts/release-acceptance.py
      - name: Upload redacted acceptance ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reliability-evidence
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: warn
