name: "OC Dev - Tier B - Native Monitoring Contracts"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare pinned dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && backend/.venv/bin/pip install -r backend/requirements-providers.txt -r backend/requirements-hosts.txt
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/arch-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/arch-browser/node_modules/.bin/playwright" install --with-deps chromium
          docker pull otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
          docker create --name arch-runtime --network none otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
          docker cp arch-runtime:/otelcol-contrib "$RUNNER_TEMP/otelcol-contrib"
          docker rm arch-runtime
      - name: Full units and production frontend
        run: |
          (cd backend && .venv/bin/python -m unittest discover -s tests -v)
          npm test --prefix frontend
          npm run build --prefix frontend
      - name: Actual TLS Agent and native engines
        env:
          OPSCONTROL_OTEL_BINARY: ${{ runner.temp }}/otelcol-contrib
          ARCH001_API_ACCEPTANCE: '1'
          ARCH001_ENGINE_ACCEPTANCE: '1'
          ARCH001_RUNTIME_ACCEPTANCE: '1'
          ARCH001_EVIDENCE_DIR: ${{ runner.temp }}/arch-runtime-evidence
        run: backend/.venv/bin/python scripts/arch001-acceptance.py
      - name: Browser and tenant acceptance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/arch-browser/node_modules/playwright/index.mjs
          ARCH001_API_ACCEPTANCE: '1'
          ARCH001_ENGINE_ACCEPTANCE: '1'
          ARCH001_BROWSER_ACCEPTANCE: '1'
          ARCH001_EVIDENCE_DIR: ${{ runner.temp }}/arch-browser-evidence
        run: backend/.venv/bin/python scripts/arch001-acceptance.py
      - name: Upload actual redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch001-evidence
          path: |
            ${{ runner.temp }}/arch-runtime-evidence
            ${{ runner.temp }}/arch-browser-evidence
