name: Controlled Pentaho ETL monitoring acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install backend, frontend and isolated browser tools
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && backend/.venv/bin/pip install -r backend/requirements-providers.txt -r backend/requirements-hosts.txt
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/etl-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/etl-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: ETL source and schedule boundaries, provider regression and frontend build
        run: |
          (cd backend && .venv/bin/python -m scripts.etl_unit_probe)
          (cd backend && .venv/bin/python -m scripts.provider_unit_probe)
          npm run build --prefix frontend
      - name: Authenticated TLS lifecycle, source/host evidence, alerts and actual browser tests
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/etl-tools/node_modules/playwright/index.mjs
          ETL_EVIDENCE_DIR: ${{ runner.temp }}/etl-evidence
        run: backend/.venv/bin/python scripts/etl-acceptance.py
      - name: Upload ETL browser captures and redacted runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-etl-evidence
          path: ${{ runner.temp }}/etl-evidence
          if-no-files-found: warn
