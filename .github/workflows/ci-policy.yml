name: "OC Dev - Tier A - Scope and Workflow Integrity"
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Every workflow, test scope and negative security contracts
        run: |
          bash scripts/check-workflows.sh
          python scripts/ci/policy.py
          python scripts/ci/e2e_alignment.py --prepare-history
          python -m unittest discover -s tests -p 'test_ci_*.py' -v
