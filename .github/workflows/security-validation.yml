name: "OC Dev - Tier C - Secrets and Dependency Security"
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-providers.txt
            backend/requirements-hosts.txt
      - name: Install vulnerability scanner
        run: python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && python -m pip install "pip-audit>=2.9,<3"
      - name: Check published Python dependency advisories
        run: |
          mkdir -p /tmp/python-audit
          result=0
          python -m pip_audit -r backend/requirements-providers.txt -r backend/requirements-hosts.txt --strict --format json --output /tmp/python-audit/runtime.json || result=1
          python -m pip_audit -r backend/requirements-dev.txt --strict --format json --output /tmp/python-audit/development.json || result=1
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-dependency-audit
          path: /tmp/python-audit
          if-no-files-found: error
  frontend-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories
        working-directory: frontend
        run: |
          mkdir -p /tmp/npm-audit
          result=0
          npm audit --omit=dev --audit-level=moderate --json > /tmp/npm-audit/runtime.json || result=1
          npm audit --audit-level=moderate --json > /tmp/npm-audit/all.json || result=1
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-dependency-audit
          path: /tmp/npm-audit
          if-no-files-found: error
  secret-history-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
