name: Security and Dependency Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-providers.txt
            backend/requirements-hosts.txt
      - name: Install vulnerability scanner
        run: python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && python -m pip install "pip-audit>=2.9,<3"
      - name: Check published Python dependency advisories
        run: python -m pip_audit -r backend/requirements-providers.txt -r backend/requirements-hosts.txt --strict
  frontend-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
  secret-history-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
