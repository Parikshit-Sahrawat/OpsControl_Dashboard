name: Security and Dependency Validation
on:
  pull_request:
  push:
    branches: [security/phase2-release-hardening]

permissions:
  contents: read

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vulnerability scanner
        run: python -m pip install "pip-audit>=2.9,<3"
      - name: Check published Python dependency advisories
        run: python -m pip_audit -r backend/requirements.txt --strict
  frontend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and resolve frontend dependencies (lockfile currently absent)
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check production dependency advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Retain generated lockfile for reviewed reproducible installs
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock-candidate
          path: frontend/package-lock.json
  secret-history-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
