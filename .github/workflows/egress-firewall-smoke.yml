name: Network-Layer Egress Firewall Test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-docker-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify actual restricted Docker network behavior
        run: bash scripts/verify-firewall-docker.sh
      - name: Validate NetworkPolicy manifest exists and is scoped
        run: |
          test -f deploy/examples/remote-agent-networkpolicy.yaml
          grep -q 'policyTypes:' deploy/examples/remote-agent-networkpolicy.yaml
          echo "Manifest inspection is not a live CNI enforcement test."
