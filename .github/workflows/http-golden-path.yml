name: HTTP monitoring golden path
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install frontend and isolated browser tools
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/golden-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/golden-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run real HTTPS lifecycle and browser assertions
        env:
          GOLDEN_EVIDENCE_DIR: ${{ runner.temp }}/golden-evidence
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/golden-tools/node_modules/playwright/index.mjs
        run: scripts/http-golden-path.sh
      - name: Upload actual screenshots and redacted database/audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-golden-path-evidence
          path: ${{ runner.temp }}/golden-evidence
          if-no-files-found: warn
