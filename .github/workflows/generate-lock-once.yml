name: Generate Reviewed Frontend Lockfile (Temporary)
on:
  push:
    branches: [security/phase2-release-hardening]

permissions:
  contents: read

jobs:
  lock:
    if: github.repository == 'Parikshit-Sahrawat/OpsControl_Dashboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/phase2-release-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate dependency lock without installing scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated lockfile to this feature branch
        run: |
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(frontend): commit audited reproducible npm lockfile'
          git push origin HEAD:security/phase2-release-hardening
