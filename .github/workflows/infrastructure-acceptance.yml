name: Controlled infrastructure monitoring acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend, frontend and isolated browser tools
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-providers.txt -r backend/requirements-hosts.txt
          npm ci --prefix frontend --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/infra-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/infra-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Backend boundaries and frontend build
        working-directory: backend
        run: |
          .venv/bin/python -m scripts.infrastructure_unit_probe
          .venv/bin/python -m scripts.provider_unit_probe
          .venv/bin/python -m scripts.deep_checks_probe
          npm run build --prefix ../frontend
      - name: Scoped discovery, activation, health, alerts and actual browser tests
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/infra-tools/node_modules/playwright/index.mjs
          INFRA_EVIDENCE_DIR: ${{ runner.temp }}/infrastructure-evidence
        run: backend/.venv/bin/python scripts/infrastructure-acceptance.py
      - name: Upload infrastructure evidence with explicit origins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-infrastructure-evidence
          path: ${{ runner.temp }}/infrastructure-evidence
          if-no-files-found: warn
