name: OpsControl Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-providers.txt
            backend/requirements-hosts.txt
      - run: python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && pip install -r requirements-providers.txt -r requirements-hosts.txt
      - run: python -m compileall -q app migrations
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.export_api_inventory /tmp/opscontrol-api-inventory.json
      - run: python -c "from sqlalchemy.orm import configure_mappers; from app.main import app; configure_mappers(); print('SQLAlchemy mapper validation passed')"

  frontend-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  unit-and-build:
    if: always()
    needs: [backend-validation, frontend-validation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/require_success.py
