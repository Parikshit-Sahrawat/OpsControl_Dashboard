name: OpsControl Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip==26.2 && pip install -r requirements-providers.txt -r requirements-hosts.txt
      - run: python -m compileall -q app migrations
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.export_api_inventory /tmp/opscontrol-api-inventory.json
      - run: python -c "from sqlalchemy.orm import configure_mappers; from app.main import app; configure_mappers(); print('SQLAlchemy mapper validation passed')"

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run build
