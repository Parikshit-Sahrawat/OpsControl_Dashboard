name: "OC Dev - Tier C - Image SBOM Vulnerabilities and Licenses"
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-artifacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: backend-runtime
            context: backend
            file: backend/Dockerfile.runtime
            target: runtime
          - role: backend-migration
            context: backend
            file: backend/Dockerfile.runtime
            target: migration
          - role: uat-backend
            context: backend
            file: backend/Dockerfile.uat
            target: ''
          - role: frontend
            context: frontend
            file: frontend/Dockerfile.demo
            target: ''
          - role: postgres
            context: .
            file: deploy/release/Dockerfile.postgres
            target: ''
          - role: ingestion-gateway
            context: .
            file: deploy/release/Dockerfile.gateway
            target: ''
          - role: production-frontend
            context: frontend
            file: frontend/Dockerfile.runtime
            target: ''
          - role: otel-contrib
            image: otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing CI policy parser dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Verify and install locked official scanner binaries
        run: python scripts/ci/install_scanners.py "$RUNNER_TEMP/scanners"
      - name: Obtain isolated candidate only, never push or deploy
        env:
          ROLE: ${{ matrix.role }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.file }}
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ -n "$IMAGE" ]]; then
            docker pull "$IMAGE"
            docker image inspect --format '{{.Id}}' "$IMAGE" > "$RUNNER_TEMP/image-result.id"
            docker tag "$IMAGE" "opscontrol-ci-$ROLE:scan"
          else
            args=()
            if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
            docker build --iidfile "$RUNNER_TEMP/image-result.id" --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt "${args[@]}" -f "$DOCKERFILE" -t "opscontrol-ci-$ROLE:scan" "$CONTEXT"
          fi
          python scripts/ci/image_coverage.py bind --role "$ROLE" --image "opscontrol-ci-$ROLE:scan" --iid-file "$RUNNER_TEMP/image-result.id" --directory "$RUNNER_TEMP/image-evidence"
      - name: CycloneDX, OS/transitive scan, licence inventory and provenance gate
        env:
          ROLE: ${{ matrix.role }}
        run: python scripts/ci/scan_image.py "opscontrol-ci-$ROLE:scan" "$RUNNER_TEMP/image-evidence" "$RUNNER_TEMP/scanners"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-evidence-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/image-evidence
            !${{ runner.temp }}/image-evidence/grype-cache/**
          if-no-files-found: error
  security-sbom:
    if: always()
    needs: [image-evidence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-evidence-*
          path: ${{ runner.temp }}/image-coverage
      - name: Verify complete exact-candidate image coverage
        if: always()
        run: python scripts/ci/image_coverage.py validate --directory "$RUNNER_TEMP/image-coverage" --source "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/image-coverage-result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-coverage-index
          path: ${{ runner.temp }}/image-coverage-result.json
          if-no-files-found: error
      - if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/require_success.py
