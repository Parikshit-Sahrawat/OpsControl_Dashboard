name: AWS EC2 Read-Only Field Acceptance
on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: "Authorized 12-digit disposable sandbox AWS account"
        required: true
      aws_region:
        description: "Region containing a disposable test instance"
        required: true
        default: ap-south-1
      instance_id:
        description: "Authorized sandbox EC2 instance ID"
        required: true

permissions:
  contents: read

jobs:
  read-only-ec2:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: aws-acceptance
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Acquire short-lived AWS identity using restricted GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.OPSCONTROL_AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: OpsControlReadonlyAcceptance
      - name: Exercise actual instance health and CloudWatch APIs
        working-directory: backend
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          APPROVED_ACCOUNT: ${{ inputs.aws_account_id }}
          APPROVED_REGION: ${{ inputs.aws_region }}
          APPROVED_INSTANCE: ${{ inputs.instance_id }}
        run: |
          python "$(git rev-parse --show-toplevel)/backend/bootstrap_pip.py" && python -m pip install 'boto3>=1.35,<2'
          PYTHONPATH=. python scripts/aws_live_acceptance.py \
            --account "$APPROVED_ACCOUNT" \
            --region "$APPROVED_REGION" \
            --instance-id "$APPROVED_INSTANCE" \
            --evidence-output "$RUNNER_TEMP/aws-evidence.json"
      - name: Upload genuine provider evidence after acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-aws-evidence
          path: ${{ runner.temp }}/aws-evidence.json
