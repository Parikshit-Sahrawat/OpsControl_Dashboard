<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OpsControl Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07111f;color:#e8eef7}button{font:inherit}.app{min-height:100vh}.top{height:64px;border-bottom:1px solid #1b2a3d;background:#091625;display:flex;align-items:center;padding:0 28px;gap:30px}.brand{font-weight:800;font-size:20px}.nav{display:flex;gap:7px}.nav button{background:transparent;border:0;color:#91a3b8;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#13243a;color:#fff}.content{padding:26px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.muted{color:#8fa1b5}.refresh{font-size:12px;color:#7f93aa}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0b1929;border:1px solid #1c3047;border-radius:12px;padding:18px}.kpi .label{color:#93a6bb;font-size:13px}.kpi .num{font-size:30px;font-weight:800;margin:8px 0}.green{color:#49d18d}.red{color:#ff6675}.yellow{color:#f4c95d}.blue{color:#63a8ff}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;margin-top:16px}.card h3{margin:0 0 15px;font-size:15px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #182a3e;text-align:left}.table th{color:#7f93aa;font-weight:600}.status{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.s-failed{background:#351a23;color:#ff7c88}.s-success{background:#123126;color:#5be39a}.s-running{background:#132d49;color:#71b2ff}.s-long{background:#3a3015;color:#f4cf62}.issue{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #182a3e}.issue:last-child{border:0}.tag{font-size:11px;color:#9db0c6}.btn{border:1px solid #2a425e;background:#112238;color:#dce8f5;padding:7px 10px;border-radius:7px;cursor:pointer}.btn:hover{background:#18304c}.drawer{position:fixed;right:0;top:0;width:min(620px,94vw);height:100vh;background:#091625;border-left:1px solid #28415e;box-shadow:-20px 0 50px #0008;z-index:5;overflow:auto;padding:24px}.drawerHead{display:flex;justify-content:space-between;align-items:flex-start}.drawer section{margin-top:24px}.drawer h4{margin:0 0 12px;font-size:13px;color:#9db0c6;text-transform:uppercase;letter-spacing:.08em}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{background:#0d1d30;border-radius:8px;padding:10px}.kv small{display:block;color:#7f93aa}.timeline,.note{border-left:2px solid #2b4867;padding-left:14px;margin:13px 0}.note{border-left-color:#4a8ddc}.note b{font-size:12px}.error{background:#25171d;border:1px solid #55303b;padding:12px;border-radius:8px;font-family:monospace;font-size:12px}.close{border:0;background:transparent;color:#9db0c6;font-size:24px;cursor:pointer}.overlay{position:fixed;inset:0;background:#0008;z-index:4}.controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.controls .btn.active{background:#1a395c;border-color:#477eaf}.full{margin-top:16px}.form{display:grid;gap:9px}.form textarea{width:100%;min-height:85px;background:#07111f;border:1px solid #29415d;color:#e8eef7;border-radius:8px;padding:10px}.form .btn{justify-self:start}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.nav{overflow:auto}.top{padding:0 14px;gap:12px}}@media(max-width:600px){.kpis{grid-template-columns:1fr}.content{padding:16px}.top{height:auto;min-height:64px;flex-wrap:wrap;padding:12px}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const jobs=[
{name:'JC_Pricing_Daily',server:'HERO-PRDAPP001',env:'PROD',start:'08:00:01',duration:'05m 48s',sla:'30m',status:'FAILED',step:'Update Customer Database',error:'Connection timeout',incident:'INC0012345'},
{name:'Job_SPP_PAI',server:'HERO-PRDAPP001',env:'PROD',start:'08:15:02',duration:'18m 12s',sla:'30m',status:'RUNNING',step:'Transform Pricing',error:'—',incident:'—'},
{name:'Customer_Extract',server:'ETL-PRD-02',env:'PROD',start:'07:00:00',duration:'24m 01s',sla:'25m',status:'LONG_RUNNING',step:'Extract Customer Data',error:'—',incident:'INC0012339'},
{name:'Inventory_Daily',server:'ETL-PRD-03',env:'PROD',start:'06:30:01',duration:'17m 33s',sla:'30m',status:'SUCCESS',step:'—',error:'—',incident:'—'}
];
let selected=null,filter='All',nav='Overview';
const statusClass=s=>s==='FAILED'?'s-failed':s==='SUCCESS'?'s-success':s==='RUNNING'?'s-running':'s-long';
function render(){
document.getElementById('root').innerHTML=`
<div class="app"><header class="top"><div class="brand">OpsControl</div><nav class="nav">${['Overview','ETL Jobs','VM Health','APIs','Incidents','Reports','Resource Management'].map(x=>`<button class="${nav===x?'active':''}" onclick="nav='${x}';render()">${x}</button>`).join('')}</nav></header>
<main class="content"><div class="head"><div><h2 style="margin:0">Overview</h2><div class="muted">Production operations — attention first</div></div><div class="refresh">● Auto refresh · 5 seconds</div></div>
<div class="kpis">
<div class="card kpi"><div class="label">ETL Jobs</div><div class="num red">1</div><div class="muted">failed · 1 running · 1 at risk</div></div>
<div class="card kpi"><div class="label">VM Health</div><div class="num yellow">1</div><div class="muted">critical issue requiring attention</div></div>
<div class="card kpi"><div class="label">APIs & Services</div><div class="num green">18</div><div class="muted">healthy · 1 high latency</div></div>
<div class="card kpi"><div class="label">Active Incidents</div><div class="num red">2</div><div class="muted">1 critical · 1 major</div></div>
</div>
<div class="grid"><div class="card"><h3>Recent ETL Jobs</h3><div class="controls">${['All','Success','Failed','Running','Long Running'].map(x=>`<button class="btn ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div>
<table class="table"><thead><tr><th>Job</th><th>Server</th><th>Start</th><th>Duration</th><th>Status</th></tr></thead><tbody>${jobs.filter(j=>filter==='All'||j.status===filter.toUpperCase().replace(' ','_')).map((j,i)=>`<tr onclick="selected=${i};render()" style="cursor:pointer"><td><b>${j.name}</b><br><span class="tag">${j.env}</span></td><td>${j.server}</td><td>${j.start}</td><td>${j.duration}</td><td><span class="status ${statusClass(j.status)}">${j.status}</span></td></tr>`).join('')}</tbody></table></div>
<div><div class="card"><h3>Recent VM Issues</h3><div class="issue"><div><b>HERO-PRDAPP001</b><div class="tag">D: Drive · 94%</div></div><span class="status s-long">WARNING</span></div><div class="issue"><div><b>ETL-PRD-03</b><div class="tag">CPU · 91%</div></div><span class="status s-failed">CRITICAL</span></div></div>
<div class="card full"><h3>Active Incidents</h3><div class="issue"><div><b>INC0012345</b><div class="tag">JC_Pricing_Daily · Database timeout</div></div><span class="status s-failed">CRITICAL</span></div><div class="issue"><div><b>INC0012339</b><div class="tag">Customer_Extract · SLA breach</div></div><span class="status s-long">MAJOR</span></div></div></div></div></main>
${selected!==null?drawer(jobs[selected]):''}</div>`;
}
function drawer(j){
return `<div class="overlay" onclick="selected=null;render()"></div><aside class="drawer"><div class="drawerHead"><div><div class="tag">JOB ORDER HISTORY · JH-000842</div><h2 style="margin:5px 0 4px">${j.name}</h2><span class="status ${statusClass(j.status)}">${j.status}</span></div><button class="close" onclick="selected=null;render()">×</button></div>
<section><h4>Execution Summary</h4><div class="summary">${[['Organization','ABC Corporation'],['VM',j.server],['Environment',j.env],['Execution','SCHEDULED'],['Start',j.start+' IST'],['Duration',j.duration],['Expected runtime','20m'],['SLA',j.sla],['Incident',j.incident],['Last update','08:08:14 IST']].map(x=>`<div class="kv"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></section>
<section><h4>Failure Diagnosis</h4><div class="kv"><small>Failed step</small><b>${j.step}</b></div><div class="error" style="margin-top:8px">PentahoError: ${j.error}</div><div class="kv" style="margin-top:8px"><small>OpsControl suspected cause</small><b>Database listener unavailable · Confidence HIGH</b></div></section>
<section><h4>Execution Timeline</h4><div class="timeline">08:00:01 · Job started</div><div class="timeline">08:01:12 · Extract started</div><div class="timeline">08:04:21 · Transformation started</div><div class="timeline">08:05:48 · Database connection error</div><div class="timeline">08:05:49 · Job failed</div><div class="timeline">08:06:01 · PagerDuty triggered</div><div class="timeline">08:06:05 · ServiceNow incident created</div></section>
<section><h4>Step-level Execution</h4><div class="issue"><span>Extract Customer Data</span><span class="status s-success">SUCCESS</span></div><div class="issue"><span>Transform Pricing</span><span class="status s-success">SUCCESS</span></div><div class="issue"><span>${j.step}</span><span class="status s-failed">FAILED</span></div></section>
<section><h4>Related Health</h4><div class="summary"><div class="kv"><small>Database</small><b class="red">UNAVAILABLE</b></div><div class="kv"><small>CPU</small><b>87%</b></div><div class="kv"><small>RAM</small><b>61%</b></div><div class="kv"><small>Network</small><b class="green">HEALTHY</b></div></div></section>
<section><h4>Alert & Incident History</h4><div class="issue"><span>08:05:55 · Failure detected</span><span class="tag">CRITICAL</span></div><div class="issue"><span>08:06:01 · PagerDuty triggered</span><span class="tag">PD-12345</span></div><div class="issue"><span>08:06:05 · ServiceNow created</span><span class="tag">${j.incident}</span></div><div class="issue"><span>08:06:07 · Email sent</span><span class="tag">SLM Operations</span></div><div class="issue"><span>08:08:14 · PagerDuty acknowledged</span><span class="tag">Operator A</span></div></section>
<section><h4>Recent History · Same Job Order</h4><div class="issue"><span>07-Oct 08:04 · FAILED</span><span class="tag">Database timeout</span></div><div class="issue"><span>06-Oct 08:00 · SUCCESS</span><span class="tag">18m</span></div><div class="issue"><span>05-Oct 08:00 · SUCCESS</span><span class="tag">19m</span></div></section>
<section><h4>Investigation</h4><div class="summary"><div class="kv"><small>Status</small><b class="yellow">INVESTIGATING</b></div><div class="kv"><small>Operator</small><b>Operator A</b></div><div class="kv"><small>Started</small><b>08:08:14 IST</b></div><div class="kv"><small>Duration</small><b>24m 31s</b></div></div>
<div class="note"><b>08:08 · Operator A</b><br>Acknowledged alert and started investigation.</div><div class="note"><b>08:10 · Operator A</b><br>Database team contacted.</div><div class="note"><b>08:18 · Operator A</b><br>DB listener appears unavailable. Waiting for DB team confirmation.</div>
<div class="kv" style="margin-top:10px"><small>Current Summary</small><b>Database connection failure under investigation with DB team.</b></div>
<div class="form" style="margin-top:12px"><textarea placeholder="Add chronological operator note..."></textarea><button class="btn" onclick="alert('Prototype: note will be saved to the investigation timeline.')">Add Note</button></div></section>
<section><h4>Resolution</h4><div class="kv"><small>Root Cause</small><b>PENDING</b></div><div class="kv" style="margin-top:8px"><small>Recovery</small><b>Performed outside OpsControl by appropriate team</b></div></section>
</aside>`;
}
render();
setInterval(()=>{if(!selected)render()},5000);
</script></body></html>
